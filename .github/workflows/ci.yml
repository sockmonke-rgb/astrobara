name: checks

# Runs on every push and pull request. Nothing here needs anything installed
# on your machine — which is the point: the checks happen even when the commit
# was an edit made on a phone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push supersedes the run before it. Without this, two commits a minute
# apart leave the first run grinding away on a build nobody is looking at.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Tier 0 — static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # preflight.py shells out to seedcheck.js for P11.
      - run: python3 preflight.py index.html SEEDS.txt

  verify:
    name: Tier 0 in the page, and tunnel contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      - run: node verify.js index.html SEEDS.txt verify-out
      # The rendered map, kept whether or not the job passed: when the contrast
      # check fails, the picture is the first thing worth looking at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-map
          path: verify-out/

  cine:
    name: The animatic gives the colony back
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      # Replays the opening on a colony set to turn 706 and checks that the
      # turn, the ground and every resource come back untouched. V2.12.0 shipped
      # a replay that reset the colony to sol 1 and then saved it.
      - run: node cine-check.js index.html

  achv:
    name: The unlock card is actually seen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      # Holds a night on a reactor to reach self-sufficiency, then watches
      # #achvslot: the card sits at z-index 21 and the verdict at 30, so this
      # is the one moment several awards can be announced where nobody can see
      # them. V2.12.10 lost MOISTURIZED exactly this way.
      - run: node achv-check.js index.html

  survival:
    name: Survival bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      # 400 colonies, in the shipped build, against the last agreed numbers.
      # Deterministic, so any movement is the model moving.
      - run: node survival.js index.html 400 290 survival-baseline.json | tee survival.txt
      - name: Put the table in the job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat survival.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # itch.io gets the same file GitHub Pages serves, and only once every check
  # above has passed. The itch page used to be a zip uploaded by hand, which is
  # how it ended up a dozen builds behind the game.
  #
  # Every run stages the build and fetches butler, so a pull request proves the
  # job works without touching the page. Only main pushes — on a push, or from
  # the Run workflow button on the Actions tab.
  itch:
    name: Publish to itch.io
    needs: [preflight, verify, cine, achv, survival]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Only the game goes up. The repo root is also the changelog, the harness
      # and the test plan, and none of that belongs on the page. The build stamp
      # goes up with it as the itch version, so the page and the watermark name
      # the same build.
      - name: Stage the build
        run: |
          mkdir -p itch
          cp index.html itch/index.html
          v=$(grep -oP "^const BUILD = '\K[^']+" index.html || true)
          if [ -z "$v" ]; then echo "::error::no BUILD stamp in index.html"; exit 1; fi
          echo "BUILD=$v" >> "$GITHUB_ENV"
          echo "staged $v"; ls -la itch
      # broth is itch's permanent URL for the latest butler.
      - name: Get butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: Push to sockmonke/astrobara:html5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Until the key is in the repo's Actions secrets this says so and
          # stops, rather than turning every run red.
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY is not set in Settings > Secrets and variables > Actions, so nothing went to itch.io."
            exit 0
          fi
          # --if-changed: a commit that only touches the docs pushes nothing.
          butler/butler push itch sockmonke/astrobara:html5 --userversion "$BUILD" --if-changed
          echo "Pushed $BUILD to https://sockmonke.itch.io/astrobara" >> "$GITHUB_STEP_SUMMARY"
